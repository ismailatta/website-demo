<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionTrack - Goal Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/goal.css">
    <link rel="stylesheet" href="../css/navigation.css">
    
</head>
<body>
    <div class="app-wrapper">
        <!-- Navigation Sidebar -->
        <div id="app-navigation" class="main-nav"></div>

        <div class="app-container">
            <main class="main-content">
                <header>
                    <h2>My Goals</h2>
                    <div class="header-actions">
                        <button id="new-goal-btn" class="btn-primary">
                            <i class="fas fa-plus"></i> New Goal
                        </button>
                        <div class="search-box">
                            <input type="text" placeholder="Search goals...">
                            <i class="fas fa-search"></i>
                        </div>
                    </div>
                </header>

                <section class="goals-dashboard">
                    <div class="stats-cards">
                        <div class="stat-card">
                            <div class="stat-icon blue">
                                <i class="fas fa-bullseye"></i>
                            </div>
                            <div class="stat-info">
                                <h3 id="total-goals">0</h3>
                                <p>Total Goals</p>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon green">
                                <i class="fas fa-check-circle"></i>
                            </div>
                            <div class="stat-info">
                                <h3 id="completed-goals">0</h3>
                                <p>Completed</p>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon orange">
                                <i class="fas fa-spinner"></i>
                            </div>
                            <div class="stat-info">
                                <h3 id="in-progress-goals">0</h3>
                                <p>In Progress</p>
                            </div>
                        </div>
                    </div>

                    <div class="goals-list" id="goals-list">
                        <!-- Goals will be inserted here by JavaScript -->
                    </div>
                </section>
            </main>

            <!-- All modals are defined here but hidden by default -->
            <div class="modal" id="goal-details-modal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3 id="goal-modal-title">Goal Details</h3>
                        <button class="close-modal">&times;</button>
                    </div>
                    <div class="modal-body">
                        <div class="goal-progress-container">
                            <div class="progress-info">
                                <span class="progress-percent">0%</span>
                                <span class="progress-text">Complete</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: 0%"></div>
                            </div>
                        </div>

                        <div class="goal-purpose">
                            <h4>Purpose</h4>
                            <p id="goal-purpose-text">Loading purpose...</p>
                        </div>

                        <div class="stages-container">
                            <h4>Stages</h4>
                            <div class="stages-list" id="stages-list"></div>
                            <button class="btn-secondary add-stage-btn">
                                <i class="fas fa-plus"></i> Add Stage
                            </button>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn-secondary" id="save-goal-changes">Save Changes</button>
                        <button class="btn-danger" id="delete-goal-btn">Delete Goal</button>
                    </div>
                </div>
            </div>

            <div class="modal" id="new-goal-modal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3>Create New Goal</h3>
                        <button class="close-modal">&times;</button>
                    </div>
                    <div class="modal-body">
                        <form id="new-goal-form">
                            <div class="form-group">
                                <label for="goal-title">Goal Title</label>
                                <input type="text" id="goal-title" placeholder="e.g., Learn Spanish" required>
                            </div>
                            <div class="form-group">
                                <label for="goal-purpose">Why is this goal important?</label>
                                <textarea id="goal-purpose" rows="3" placeholder="Describe your motivation..." required></textarea>
                            </div>
                            <div class="form-group">
                                <label>Initial Stages (optional)</label>
                                <div class="stages-input-container" id="stages-input-container"></div>
                                <button type="button" class="btn-text" id="add-another-stage">
                                    <i class="fas fa-plus"></i> Add Another Stage
                                </button>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn-secondary close-modal">Cancel</button>
                        <button type="submit" form="new-goal-form" class="btn-primary">Create Goal</button>
                    </div>
                </div>
            </div>

            <div class="modal" id="new-stage-modal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3>Add New Stage</h3>
                        <button class="close-modal">&times;</button>
                    </div>
                    <div class="modal-body">
                        <form id="new-stage-form">
                            <div class="form-group">
                                <label for="stage-title">Stage Title</label>
                                <input type="text" id="stage-title" placeholder="e.g., Beginner Level" required>
                            </div>
                            <div class="form-group">
                                <label for="stage-purpose">Why is this stage important?</label>
                                <textarea id="stage-purpose" rows="3" placeholder="Describe the purpose..." required></textarea>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn-secondary close-modal">Cancel</button>
                        <button type="submit" form="new-stage-form" class="btn-primary">Add Stage</button>
                    </div>
                </div>
            </div>

            <div class="modal" id="new-step-modal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3>Add New Step</h3>
                        <button class="close-modal">&times;</button>
                    </div>
                    <div class="modal-body">
                        <form id="new-step-form">
                            <div class="form-group">
                                <label for="step-title">Step Title</label>
                                <input type="text" id="step-title" placeholder="e.g., Learn basic vocabulary" required>
                            </div>
                            <div class="form-group">
                                <label for="step-purpose">Why is this step important?</label>
                                <textarea id="step-purpose" rows="3" placeholder="Describe the purpose..." required></textarea>
                            </div>
                            <div class="form-group">
                                <label>Tasks (optional)</label>
                                <div class="tasks-input-container" id="tasks-input-container"></div>
                                <button type="button" class="btn-text" id="add-another-task">
                                    <i class="fas fa-plus"></i> Add Another Task
                                </button>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn-secondary close-modal">Cancel</button>
                        <button type="submit" form="new-step-form" class="btn-primary">Add Step</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/navigation.js"></script>
    <script src="../js/goal.js"></script>
</body>
</html>
