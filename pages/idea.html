<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IdeaFlow - Thought Management Tool</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/idea.css">
    <link rel="stylesheet" href="../css/navigation.css">
    
</head>
<body>
    <div class="app-wrapper">
        <!-- Navigation Sidebar -->
        <div id="app-navigation" class="main-nav"></div>

        <!-- Main App Content -->
        <div class="app-container">
            <header class="app-header">
                <h1>IdeaFlow</h1>
                <p class="subtitle">Organize, Analyze & Develop Your Thoughts</p>
            </header>

            <div class="main-content">
                <div class="control-panel">
                    <button id="add-idea-btn" class="primary-btn">
                        <i class="fas fa-plus"></i> Add New Idea
                    </button>
                    <div class="filter-options">
                        <span>Filter:</span>
                        <button class="filter-btn active" data-filter="all">All</button>
                        <button class="filter-btn" data-filter="active">Active</button>
                        <button class="filter-btn" data-filter="completed">Completed</button>
                        <button class="filter-btn" data-filter="important">Important</button>
                    </div>
                </div>

                <div id="idea-container" class="idea-container">
                    <!-- Ideas will be added here dynamically -->
                </div>

                <div class="analysis-panel">
                    <h3>Idea Analysis</h3>
                    <div class="progress-stats">
                        <div class="stat-item">
                            <div class="stat-value" id="total-ideas">0</div>
                            <div class="stat-label">Total Ideas</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="completed-ideas">0</div>
                            <div class="stat-label">Completed</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="progress-percent">0%</div>
                            <div class="stat-label">Progress</div>
                        </div>
                    </div>
                    <div class="tag-cloud" id="tag-cloud">
                        <h4>Common Tags</h4>
                        <!-- Tags will appear here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/navigation.js"></script>
    <script src="../js/idea.js"></script>
</body>
</html>
